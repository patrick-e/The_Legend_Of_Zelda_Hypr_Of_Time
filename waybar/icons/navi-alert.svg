<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="aura" cx="50%" cy="53%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="35%" stop-color="#e8e6ff" stop-opacity="0.80"/>
      <stop offset="68%" stop-color="#c2bef5" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9890e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="ray-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="outer-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.0" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft outer lavender-white radial aura -->
  <circle cx="64" cy="68" r="60" fill="url(#aura)"/>

  <!-- Radiating light rays behind the fairy -->
